[project]
name = "bitexual"
version = "0.1.0"
description = "Python package and CLI for bitext alignment, with support for interactive HTML output and PDF output via XeLaTeX."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adiumentum>=0.8.2",
    "arabic-buckwalter-transliteration>=1.0.5",
    "deep-translator>=1.11.4",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.2.1",
    "transformers>=5.5.0",
]

[project.scripts]
align = "bitext_aligner.__main__:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.12.0",
    "pyrefly>=0.59.1",
]
